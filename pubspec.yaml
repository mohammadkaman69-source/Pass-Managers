name: pass_managers

description: Pass Managers application

publish_to: "none"

version: 1.0.3+4

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.7.0
  path: ^1.9.1
  pdf: ^3.11.3
  file_picker: ^12.0.0-beta.7
  local_auth: ^3.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/BNazanin.ttf
    - assets/icon/app_icon.png
