name: pass_managers

description: NexVault application

publish_to: "none"

version: 1.0.5+6

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.7.0
  path: ^1.9.1
  path_provider: ^2.1.5
  pdf: ^3.11.3
  file_picker: ^12.0.0-beta.7
  local_auth: ^3.0.2
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_foreground: "assets/icon/adaptive_foreground.png"
  adaptive_icon_background: "assets/icon/adaptive_background.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/BNazanin.ttf
    - assets/icon/app_icon.png
    - assets/icon/adaptive_foreground.png
    - assets/icon/adaptive_background.png
    - assets/icon/icon_small.png
    - assets/logo/nexvault_logo.png
    - assets/splash/splash_logo.png
    - assets/splash/splash_background.png
    - assets/web/favicon.png
    - assets/animation/nexvault_logo_animation.mp4
