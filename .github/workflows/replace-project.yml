name: Replace Project From Clean ZIP

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    name: Replace project from uploaded clean ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for project ZIP..."

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "${ZIP_FILE:-}" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"
          echo "Using: $ZIP_FILE"

      - name: Validate ZIP
        shell: bash
        run: |
          set -euo pipefail

          unzip -t "$ZIP_FILE" >/dev/null

          echo "ZIP archive is valid."

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pass_managers_clean
          mkdir -p /tmp/pass_managers_clean

          unzip -q "$ZIP_FILE" -d /tmp/pass_managers_clean

          echo "Extracted ZIP contents:"
          find /tmp/pass_managers_clean -maxdepth 3 -type f | sort

      - name: Detect project root inside ZIP
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "/tmp/pass_managers_clean/pubspec.yaml" ]; then
            ROOT="/tmp/pass_managers_clean"
          else
            ROOT="$(find /tmp/pass_managers_clean \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -exec test -f '{}/pubspec.yaml' ';' \
              -print -quit)"
          fi

          if [ -z "${ROOT:-}" ]; then
            echo "ERROR: pubspec.yaml was not found in ZIP."
            exit 1
          fi

          echo "CLEAN_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Detected project root:"
          echo "$ROOT"

      - name: Verify required project structure
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "pubspec.yaml"
            "pubspec.lock"
            "lib"
            "android"
            "windows"
            "windows/CMakeLists.txt"
            "windows/runner"
            "android/settings.gradle"
            "android/app"
          )

          for item in "${required[@]}"; do
            if [ ! -e "$CLEAN_ROOT/$item" ]; then
              echo "ERROR: Required item missing from ZIP:"
              echo "$item"
              exit 1
            fi
          done

          echo "Required project structure is present."

      - name: Show ZIP project manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FILES INCLUDED IN CLEAN ZIP"
          echo "========================================"

          find "$CLEAN_ROOT" \
            -type f \
            -not -path '*/.git/*' \
            | sed "s#^$CLEAN_ROOT/##" \
            | sort

      - name: Backup current repository state
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/current_project_backup

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$(basename "$ZIP_FILE")" \
            -exec cp -a {} /tmp/current_project_backup/ \;

          echo "Current project state backed up temporarily."

      - name: Remove old project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old project files..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$(basename "$ZIP_FILE")" \
            -exec rm -rf {} +

          echo "Old project files removed."

      - name: Remove obsolete workflow files
        shell: bash
        run: |
          set -euo pipefail

          if [ -d ".github/workflows" ]; then
            find .github/workflows \
              -type f \
              ! -name 'build.yml' \
              ! -name 'Replica Project Test.yml' \
              -delete
          fi

          echo "Obsolete workflow files removed."

      - name: Install clean project
        shell: bash
        run: |
          set -euo pipefail

          echo "Installing project from clean ZIP..."

          rsync -a \
            "$CLEAN_ROOT/" \
            ./

          echo "Project installed."

      - name: Verify Android and Windows were preserved
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking Android..."

          test -f android/settings.gradle
          test -d android/app

          echo "Android OK."

          echo "Checking Windows..."

          test -f windows/CMakeLists.txt
          test -d windows/runner
          test -f windows/runner/Runner.rc

          echo "Windows OK."

      - name: Verify important application files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "pubspec.yaml"
            "pubspec.lock"
            "lib/main.dart"
            "lib/screens/home_page.dart"
            "lib/services/backup_service.dart"
            "lib/services/pdf_export_service.dart"
            "lib/security/biometric_service.dart"
          )

          for f in "${required[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required application file missing:"
              echo "$f"
              exit 1
            fi
          done

          echo "Application files OK."

      - name: Remove temporary ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f "$ZIP_FILE"

          echo "Uploaded ZIP removed from repository working tree."

      - name: Verify forbidden legacy files
        shell: bash
        run: |
          set -euo pipefail

          forbidden=(
            "AI_REPORT.json"
            "ai-report.txt"
            "test/widget_test.dart"
            ".github/workflows/flutter-create.yml"
            ".github/workflows/regenerate-windows.yml"
          )

          for f in "${forbidden[@]}"; do
            if [ -e "$f" ]; then
              echo "ERROR: Forbidden legacy file still exists:"
              echo "$f"
              exit 1
            fi
          done

          echo "No forbidden legacy files found."

      - name: Show final project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "FINAL PROJECT STRUCTURE"
          echo "========================================"

          find . \
            -path './.git' -prune \
            -o -type f -print \
            | sort

      - name: Check Git status
        shell: bash
        run: |
          set -euo pipefail

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Replace project with clean ZIP"

      - name: Push replacement
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main
