name: Check CMake Cache

"on":
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Search Visual Studio 2019
        shell: bash
        run: |
          echo "Searching all files..."
          grep -R "Visual Studio 16 2019" . || true

      - name: List CMake files
        shell: bash
        run: |
          find . -name "CMakeCache.txt" -o -name "CMakePresets.json" -o -name "*.cmake"

      - name: Check environment
        shell: bash
        run: |
          echo "CMAKE_GENERATOR=$CMAKE_GENERATOR"
          cmake --version
