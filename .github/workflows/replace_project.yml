name: Replace Project From Clean ZIP

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    name: Replace project from clean ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail

          test -f Pass-Managers-final-clean.zip

          echo "Source ZIP found:"
          ls -lh Pass-Managers-final-clean.zip

      - name: Extract clean ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pass_managers_clean
          mkdir -p /tmp/pass_managers_clean

          unzip -q -o Pass-Managers-final-clean.zip \
            -d /tmp/pass_managers_clean

          if [ -f /tmp/pass_managers_clean/pubspec.yaml ]; then
            ROOT=/tmp/pass_managers_clean
          else
            ROOT=$(find /tmp/pass_managers_clean \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              | head -n 1)
          fi

          test -n "${ROOT:-}"
          test -f "$ROOT/pubspec.yaml"

          echo "CLEAN_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "===== CLEAN ZIP ROOT ====="
          echo "$ROOT"

      - name: Show clean ZIP manifest
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FILES INSIDE CLEAN ZIP ====="

          find "$CLEAN_ROOT" \
            -type f \
            -printf '%P\n' \
            | sort

      - name: Verify clean ZIP core files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "pubspec.yaml"
            "pubspec.lock"
            "lib/main.dart"
          )

          for f in "${required[@]}"; do
            if [ ! -f "$CLEAN_ROOT/$f" ]; then
              echo "ERROR: Required file missing from clean ZIP:"
              echo "$f"
              exit 1
            fi
          done

          echo "Core clean ZIP files verified."

      - name: Remove old project files
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old project files..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'Pass-Managers-final-clean.zip' \
            -exec rm -rf {} +

          echo "Old project files removed."

      - name: Remove legacy workflows
        shell: bash
        run: |
          set -euo pipefail

          if [ -d ".github/workflows" ]; then
            find .github/workflows \
              -type f \
              ! -name 'build.yml' \
              ! -name 'Replace Project From Clean ZIP.yml' \
              -delete
          fi

      - name: Install clean project
        shell: bash
        run: |
          set -euo pipefail

          rsync -a \
            --exclude '.github/' \
            "$CLEAN_ROOT/" \
            ./

          echo "Clean project copied."

      - name: Remove temporary ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f Pass-Managers-final-clean.zip

      - name: Verify forbidden legacy files are gone
        shell: bash
        run: |
          set -euo pipefail

          forbidden=(
            "AI_REPORT.json"
            "ai-report.txt"
            "test/widget_test.dart"
          )

          for f in "${forbidden[@]}"; do
            if [ -e "$f" ]; then
              echo "ERROR: Legacy file still exists:"
              echo "$f"
              exit 1
            fi
          done

          echo "Forbidden legacy files verified as removed."

      - name: Show final project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FINAL PROJECT FILES ====="

          find . \
            -path './.git' -prune \
            -o -type f -print \
            | sort

      - name: Show Git status
        shell: bash
        run: |
          set -euo pipefail

          echo "===== GIT STATUS ====="
          git status --short

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No project changes detected."
            exit 0
          fi

          git commit -m "Replace project with clean final project"

      - name: Push project replacement
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main
