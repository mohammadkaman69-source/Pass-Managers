name: Replace Project From Clean ZIP

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    name: Replace project from clean ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify source ZIP
        shell: bash
        run: |
          set -euo pipefail
          test -f Pass-Managers-final-clean.zip

      - name: Extract clean ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pass_managers_clean
          mkdir -p /tmp/pass_managers_clean

          unzip -q -o Pass-Managers-final-clean.zip \
            -d /tmp/pass_managers_clean

          if [ -f /tmp/pass_managers_clean/pubspec.yaml ]; then
            ROOT=/tmp/pass_managers_clean
          else
            ROOT=$(find /tmp/pass_managers_clean -mindepth 1 -maxdepth 1 -type d -print -quit)
          fi

          test -n "${ROOT:-}"
          test -f "$ROOT/pubspec.yaml"

          echo "CLEAN_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify clean ZIP required files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "pubspec.yaml"
            "pubspec.lock"
            "lib/main.dart"
            "lib/security/biometric_service.dart"
            "lib/services/backup_service.dart"
            "lib/services/pdf_export_service.dart"
            "android/settings.gradle"
            "android/app/build.gradle"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
            "android/app/src/main/kotlin/com/example/pass_managers/MainActivity.kt"
            "windows/CMakeLists.txt"
          )

          for f in "${required[@]}"; do
            test -f "$CLEAN_ROOT/$f" || {
              echo "Missing from clean ZIP: $f"
              exit 1
            }
          done

      - name: Remove old project files
        shell: bash
        run: |
          set -euo pipefail

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'Pass-Managers-final-clean.zip' \
            -exec rm -rf {} +

          find .github/workflows -type f \
            ! -name 'build.yml' \
            -delete 2>/dev/null || true

      - name: Install clean project except workflow
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude '.github/' \
            "$CLEAN_ROOT/" \
            ./

      - name: Remove temporary ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f Pass-Managers-final-clean.zip

      - name: Verify forbidden legacy files are gone
        shell: bash
        run: |
          set -euo pipefail

          forbidden=(
            ".github/workflows/flutter-create.yml"
            ".github/workflows/regenerate-windows.yml"
            "AI_REPORT.json"
            "ai-report.txt"
            "lib/services/password_service.dart"
            "test/widget_test.dart"
          )

          for f in "${forbidden[@]}"; do
            if [ -e "$f" ]; then
              echo "Legacy file still exists: $f"
              exit 1
            fi
          done

      - name: Verify roadmap files
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/security/biometric_service.dart
          test -f lib/services/backup_service.dart

      - name: Show exact replacement result
        shell: bash
        run: |
          set -euo pipefail

          echo "===== GIT STATUS ====="
          git status --short

          echo
          echo "===== PROJECT FILES ====="
          find . \
            -path './.git' -prune \
            -o -type f -print \
            | sort

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No project changes detected."
            exit 0
          fi

          git commit -m "Replace project with clean final project"

      - name: Push project replacement
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
