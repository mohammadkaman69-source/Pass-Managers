name: AI Coder Agent

"on":
  workflow_dispatch:

jobs:
  ai-agent:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Show project information
        run: |
          echo "Project files:"
          ls -la

          echo "Git branch:"
          git branch


      - name: Prepare AI request
        run: |
          echo "Analyze this Flutter project and find possible problems." > prompt.txt

          echo "Files:" >> prompt.txt

          find . -maxdepth 3 -type f >> prompt.txt


      - name: Call GPT-4.1

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}

        run: |

          curl https://api.openai.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -d '{
            "model": "gpt-4.1",
            "messages": [
              {
                "role": "system",
                "content": "You are a senior Flutter developer."
              },
              {
                "role": "user",
                "content": "Analyze this project and suggest improvements."
              }
            ]
          }' > AI_REPORT.json


      - name: Save AI report

        run: |

          git config user.name "AI-Agent"

          git config user.email "actions@github.com"

          git add AI_REPORT.json

          git commit -m "AI Agent report" || echo "No changes"

          git push
