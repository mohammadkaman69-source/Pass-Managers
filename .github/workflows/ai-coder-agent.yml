name: AI Coder Agent

"on":
  workflow_dispatch:

jobs:
  ai-agent:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show project information
        run: |
          echo "Repository:"
          echo "$GITHUB_REPOSITORY"

          echo "Branch:"
          echo "$GITHUB_REF_NAME"

          echo "Files:"
          find . -maxdepth 3 -type f \
            -not -path './.git/*' \
            | sort

      - name: Prepare AI request
        run: |
          echo "Analyze this Flutter project and identify build errors and possible fixes." > prompt.txt

          echo "" >> prompt.txt
          echo "Project files:" >> prompt.txt

          find . -maxdepth 3 -type f \
            -not -path './.git/*' \
            | sort >> prompt.txt

      - name: Call GPT-4.1
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}

        run: |
          set -e

          echo "Checking API key..."

          if [ -z "$OPENAI_API_KEY" ]; then
            echo "ERROR: OPENAI_KEY secret is empty or unavailable."
            exit 1
          fi

          echo "API key is available."

          HTTP_CODE=$(curl \
            --silent \
            --show-error \
            --output AI_RESPONSE.json \
            --write-out "%{http_code}" \
            https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d '{
              "model": "gpt-4.1",
              "messages": [
                {
                  "role": "system",
                  "content": "You are a senior Flutter developer. Analyze software projects, identify build errors, and propose precise fixes."
                },
                {
                  "role": "user",
                  "content": "Analyze this Flutter project and identify possible build problems."
                }
              ]
            }')

          echo "HTTP status: $HTTP_CODE"

          echo "OpenAI response:"
          cat AI_RESPONSE.json

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "ERROR: OpenAI API request failed."
            exit 1
          fi

          echo "OpenAI API request succeeded."

          cp AI_RESPONSE.json AI_REPORT.json

      - name: Save AI report
        run: |
          git config user.name "AI-Agent"
          git config user.email "actions@github.com"

          git add AI_REPORT.json

          git commit -m "AI Agent report" || echo "No changes to commit"

          git push
