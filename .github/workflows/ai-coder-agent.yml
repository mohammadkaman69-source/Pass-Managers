name: AI Coder Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main


permissions:
  contents: write
  actions: read
  issues: write


jobs:

  ai-agent:

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y jq


      - name: Collect project information
        run: |

          echo "===== PROJECT FILES =====" > context.txt

          find . \
          -not -path "./.git/*" \
          -maxdepth 4 \
          -type f >> context.txt


          echo "===== GIT HISTORY =====" >> context.txt

          git log --oneline -20 >> context.txt


      - name: Create AI prompt
        run: |

          echo "
You are an expert Flutter developer.

Analyze this repository.
Find possible build problems.
Suggest fixes.

" > prompt.txt

          cat context.txt >> prompt.txt


      - name: Send request to GPT-4.1

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}

        run: |

          jq -Rs '{
            model:"gpt-4.1",
            messages:[
              {
                role:"system",
                content:"You are a senior Flutter engineer."
              },
              {
                role:"user",
                content:.
              }
            ]
          }' prompt.txt > request.json


          curl https://api.openai.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -d @request.json \
          > AI_REPORT.json


      - name: Save report

        run: |

          git config user.name "AI-Agent"
          git config user.email "actions@github.com"

          git add AI_REPORT.json

          git commit \
          -m "AI Agent analysis report" \
          || echo "No changes"

          git push origin main || true
