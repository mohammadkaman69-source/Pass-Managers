name: AI Coder Agent

on:
  workflow_dispatch:

  push:
    branches:
      - main

  workflow_run:
    workflows:
      - Pass Managers Build
    types:
      - completed


permissions:
  contents: write
  actions: read
  issues: write


jobs:

  ai-agent:

    if: >
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'failure'


    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y jq


      - name: Collect project information
        run: |

          echo "===== PROJECT FILES =====" > context.txt

          find . \
          -not -path "./.git/*" \
          -maxdepth 4 \
          -type f >> context.txt


          echo "" >> context.txt

          echo "===== GIT HISTORY =====" >> context.txt

          git log --oneline -20 >> context.txt


          echo "" >> context.txt

          echo "===== FLUTTER FILES =====" >> context.txt

          find . -name "*.dart" | head -100 >> context.txt



      - name: Get failed workflow logs
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}

        run: |

          gh run view \
          ${{ github.event.workflow_run.id }} \
          --log > error.log || true



      - name: Create AI prompt
        run: |

          echo "
You are an expert Flutter developer and autonomous coding agent.

Project:
Pass-Managers

Your tasks:
1. Analyze the repository.
2. Find build problems.
3. Identify Flutter compatibility issues.
4. Suggest exact code changes.
5. Do not remove functionality.

Project information:
" > prompt.txt


          cat context.txt >> prompt.txt


          echo "

Build errors:

" >> prompt.txt


          cat error.log 2>/dev/null || true



      - name: Send request to GPT-4.1

        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_KEY }}

        run: |

          jq -Rs '{ 
            model:"gpt-4.1",
            messages:[
              {
                role:"system",
                content:"You are a senior Flutter engineer."
              },
              {
                role:"user",
                content:.
              }
            ]
          }' prompt.txt > request.json



          curl https://api.openai.com/v1/chat/completions \
          -H "Content-Type: application/json" \
          -H "Authorization: Bearer $OPENAI_API_KEY" \
          -d @request.json \
          > ai-response.json



      - name: Show AI response

        run: |

          cat ai-response.json



      - name: Save AI report

        run: |

          echo "AI analysis generated"

          cp ai-response.json AI_REPORT.json



      - name: Commit AI report

        run: |

          git config user.name "AI-Coder-Agent"

          git config user.email "actions@github.com"


          git add AI_REPORT.json


          git commit \
          -m "AI Agent analysis report" \
          || echo "Nothing to commit"


          git push origin main || true
            git add .

            git commit -m "AI Agent automatic fix"

            git push origin main

          else

            echo "No changes detected"

          fi
