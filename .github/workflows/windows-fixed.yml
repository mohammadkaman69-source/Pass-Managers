name: Windows Fixed Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixed-build:
    name: Windows Fixed Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Verify Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter --version
          flutter doctor -v

      - name: Verify Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $requiredFiles = @("pubspec.yaml","lib/main.dart","windows/CMakeLists.txt","windows/flutter/CMakeLists.txt","windows/runner/CMakeLists.txt","windows/runner/main.cpp","windows/runner/flutter_window.cpp","windows/runner/flutter_window.h")
          foreach ($file in $requiredFiles) { if (-not (Test-Path $file)) { throw "Required Windows project file is missing: $file" } }

      - name: Clean generated Windows files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "windows/flutter/ephemeral") { Remove-Item "windows/flutter/ephemeral" -Recurse -Force }
          if (Test-Path "build/windows") { Remove-Item "build/windows" -Recurse -Force }

      - name: Get Flutter dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter pub get

      - name: Verify resolved dependency versions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deps = (flutter pub deps --style=compact | Out-String)
          Write-Host $deps
          if ($deps -notmatch "flutter_secure_storage 10\.3\.1") { throw "flutter_secure_storage 10.3.1 was not resolved." }
          if ($deps -notmatch "flutter_secure_storage_windows 4\.2\.2") { throw "flutter_secure_storage_windows 4.2.2 was not resolved." }
          if ($deps -notmatch "file_picker 12\.0\.0") { throw "file_picker 12.0.0 was not resolved." }
          if ($deps -notmatch "win32 6\.") { throw "win32 6.x was not resolved." }
          Write-Host "Project dependency versions are resolved correctly."

      - name: Analyze Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter analyze

      - name: Run Flutter tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "test")) { Write-Host "No test directory exists; skipping tests."; exit 0 }
          $testFiles = Get-ChildItem -Path "test" -Recurse -Filter "*_test.dart" -File -ErrorAction SilentlyContinue
          if ($null -eq $testFiles -or $testFiles.Count -eq 0) { Write-Host "No Flutter test files found; skipping tests."; exit 0 }
          flutter test

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releasePath = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releasePath)) { throw "Windows Release directory was not generated." }
          $exeFiles = Get-ChildItem -Path $releasePath -Filter "*.exe" -File
          if ($null -eq $exeFiles -or $exeFiles.Count -eq 0) { throw "Windows executable was not generated." }

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "build/windows/x64/runner/Release"
          $destination = "build/Pass-Managers-Windows-Fixed-Release.zip"
          if (Test-Path $destination) { Remove-Item $destination -Force }
          Compress-Archive -Path "$source/*" -DestinationPath $destination -Force
          if (-not (Test-Path $destination)) { throw "Windows ZIP was not created." }

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Fixed-Release
          path: build/Pass-Managers-Windows-Fixed-Release.zip
          if-no-files-found: error
