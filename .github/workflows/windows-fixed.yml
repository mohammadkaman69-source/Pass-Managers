name: Windows Fixed Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixed-build:
    name: Windows Fixed Release
    runs-on: windows-latest

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # FLUTTER
      # ============================================================

      - name: Setup Flutter 3.44.7
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Verify Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER VERSION ====="

          flutter --version

          Write-Host ""
          Write-Host "===== FLUTTER DOCTOR ====="

          flutter doctor -v


      # ============================================================
      # WINDOWS PROJECT
      #
      # IMPORTANT:
      # Do NOT regenerate Windows.
      # Do NOT modify windows/CMakeLists.txt.
      # Do NOT modify windows/runner.
      # ============================================================

      - name: Verify Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS PROJECT CHECK ====="

          $requiredFiles = @(
            "pubspec.yaml",
            "lib/main.dart",
            "windows/CMakeLists.txt",
            "windows/flutter/CMakeLists.txt",
            "windows/runner/CMakeLists.txt",
            "windows/runner/main.cpp",
            "windows/runner/flutter_window.cpp",
            "windows/runner/flutter_window.h"
          )

          foreach ($file in $requiredFiles) {

            if (-not (Test-Path $file)) {
              throw "Required Windows project file is missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Windows project structure is valid."


      # ============================================================
      # CLEAN GENERATED WINDOWS BUILD ONLY
      #
      # We intentionally do NOT touch:
      # windows/CMakeLists.txt
      # windows/runner/*
      # windows/flutter/CMakeLists.txt
      # ============================================================

      - name: Clean generated Windows files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== CLEANING GENERATED WINDOWS FILES ====="

          if (Test-Path "windows/flutter/ephemeral") {
            Write-Host "Removing windows/flutter/ephemeral..."

            Remove-Item `
              "windows/flutter/ephemeral" `
              -Recurse `
              -Force
          }

          if (Test-Path "build/windows") {
            Write-Host "Removing build/windows..."

            Remove-Item `
              "build/windows" `
              -Recurse `
              -Force
          }

          Write-Host ""
          Write-Host "Generated Windows files cleaned."


      # ============================================================
      # WINDOWS-ONLY DEPENDENCY OVERRIDES
      #
      # IMPORTANT:
      #
      # pubspec.yaml in the repository is NOT modified.
      #
      # Original project:
      #
      # file_picker ^8.3.7
      # flutter_secure_storage ^9.2.4
      #
      # Windows fixed runner:
      #
      # file_picker 12.0.0-beta.7
      # flutter_secure_storage_windows 4.2.2
      #
      # file_picker 12.x beta migrated Windows to win32 6.x.
      # flutter_secure_storage_windows 4.2.2 also uses win32 6.x.
      #
      # Therefore the two packages can coexist.
      # ============================================================

      - name: Create Windows dependency overrides
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS DEPENDENCY OVERRIDES ====="

          @"
          dependency_overrides:
            file_picker: 12.0.0-beta.7
            flutter_secure_storage_windows: 4.2.2
          "@ | Set-Content `
            -Path "pubspec_overrides.yaml" `
            -Encoding UTF8

          Write-Host ""
          Write-Host "Created temporary pubspec_overrides.yaml:"
          Write-Host ""

          Get-Content "pubspec_overrides.yaml"


      # ============================================================
      # PUB GET
      # ============================================================

      - name: Get Flutter dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER PUB GET ====="

          flutter pub get


      # ============================================================
      # VERIFY RESOLVED DEPENDENCIES
      # ============================================================

      - name: Verify resolved Windows dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== VERIFYING RESOLVED DEPENDENCIES ====="

          $deps = flutter pub deps --style=compact

          Write-Host $deps

          Write-Host ""
          Write-Host "===== CHECKING REQUIRED WINDOWS PACKAGES ====="

          if ($deps -notmatch "file_picker 12\.0\.0-beta\.7") {
            throw "file_picker 12.0.0-beta.7 was not resolved."
          }

          if ($deps -notmatch "flutter_secure_storage_windows 4\.2\.2") {
            throw "flutter_secure_storage_windows 4.2.2 was not resolved."
          }

          Write-Host ""
          Write-Host "Required Windows dependency versions resolved successfully."


      # ============================================================
      # FLUTTER ANALYZE
      # ============================================================

      - name: Analyze Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER ANALYZE ====="

          flutter analyze


      # ============================================================
      # BUILD WINDOWS
      # ============================================================

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== BUILDING WINDOWS ====="

          flutter build windows --release


      # ============================================================
      # VERIFY WINDOWS BUILD
      # ============================================================

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== VERIFYING WINDOWS BUILD ====="

          $releasePath = "build/windows/x64/runner/Release"

          if (-not (Test-Path $releasePath)) {
            throw "Windows Release directory was not generated."
          }

          $exeFiles = Get-ChildItem `
            -Path $releasePath `
            -Filter "*.exe" `
            -File

          if ($null -eq $exeFiles -or $exeFiles.Count -eq 0) {
            throw "Windows executable was not generated."
          }

          Write-Host ""
          Write-Host "Windows Release generated successfully."

          Write-Host ""
          Write-Host "===== WINDOWS RELEASE CONTENT ====="

          Get-ChildItem `
            $releasePath `
            -Recurse |
            Select-Object FullName, Length


      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== PACKAGING WINDOWS RELEASE ====="

          $source = "build/windows/x64/runner/Release"

          $destination = `
            "build/Pass-Managers-Windows-Fixed-Release.zip"

          if (-not (Test-Path $source)) {
            throw "Windows Release directory does not exist."
          }

          if (Test-Path $destination) {
            Remove-Item `
              $destination `
              -Force
          }

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Windows ZIP was not created."
          }

          Write-Host ""
          Write-Host "Windows package created successfully."

          Get-Item $destination |
            Select-Object FullName, Length


      # ============================================================
      # CLEAN TEMPORARY OVERRIDE
      #
      # This is the ONLY temporary dependency modification.
      # The repository pubspec.yaml remains untouched.
      # ============================================================

      - name: Remove temporary dependency overrides
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          Write-Host "===== CLEANUP ====="

          if (Test-Path "pubspec_overrides.yaml") {
            Remove-Item `
              "pubspec_overrides.yaml" `
              -Force

            Write-Host "Temporary dependency override removed."
          }


      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Fixed-Release
          path: build/Pass-Managers-Windows-Fixed-Release.zip
          if-no-files-found: error
