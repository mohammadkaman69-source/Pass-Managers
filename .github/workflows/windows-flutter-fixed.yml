name: Windows Flutter Fixed Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixed-build:
    name: Windows Fixed Flutter Build
    runs-on: windows-latest

    steps:
      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # FLUTTER
      # آخرین نسخه‌ای که قبلاً در پروژه Windows Build موفق داشته
      # ============================================================

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      # ============================================================
      # FLUTTER VERSION
      # ============================================================

      - name: Flutter Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER VERSION ====="
          flutter --version

      # ============================================================
      # FLUTTER DOCTOR
      # ============================================================

      - name: Flutter Doctor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER DOCTOR ====="
          flutter doctor -v

      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify Windows Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS PROJECT CHECK ====="

          $required = @(
            "pubspec.yaml",
            "lib\main.dart",
            "windows\CMakeLists.txt",
            "windows\runner\CMakeLists.txt",
            "windows\runner\main.cpp",
            "windows\runner\flutter_window.cpp",
            "windows\runner\flutter_window.h"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file is missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Windows project structure is valid."

      # ============================================================
      # READ PROJECT NAME
      # ============================================================

      - name: Read Project Name
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== PROJECT NAME ====="

          $line = Get-Content "pubspec.yaml" |
            Select-String '^name:\s*(.+)$' |
            Select-Object -First 1

          if (-not $line) {
            throw "Could not find project name in pubspec.yaml"
          }

          $projectName = $line.Matches.Groups[1].Value.Trim()

          if ([string]::IsNullOrWhiteSpace($projectName)) {
            throw "Project name is empty."
          }

          Write-Host "Project name: $projectName"

          "PROJECT_NAME=$projectName" >> $env:GITHUB_ENV

      # ============================================================
      # CLEAN
      # ============================================================

      - name: Clean Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER CLEAN ====="

          flutter clean

          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

          if (Test-Path ".dart_tool") {
            Remove-Item -Recurse -Force ".dart_tool"
          }

          Write-Host "Clean completed."

      # ============================================================
      # PUB GET
      # هیچ dependency override وجود ندارد
      # ============================================================

      - name: Flutter Pub Get
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER PUB GET ====="

          flutter pub get

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter pub get failed."
          }

          Write-Host "===== PUB GET PASSED ====="

      # ============================================================
      # SHOW DEPENDENCIES
      # ============================================================

      - name: Verify Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== RESOLVED DEPENDENCIES ====="

          flutter pub deps

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read resolved dependencies."
          }

      # ============================================================
      # ANALYZE
      # ============================================================

      - name: Flutter Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER ANALYZE ====="

          flutter analyze

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter analyze failed."
          }

          Write-Host "===== FLUTTER ANALYZE PASSED ====="

      # ============================================================
      # BUILD WINDOWS
      # ============================================================

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== BUILDING WINDOWS RELEASE ====="

          flutter build windows --release

          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed."
          }

          Write-Host "===== WINDOWS BUILD PASSED ====="

      # ============================================================
      # VERIFY EXE
      # ============================================================

      - name: Verify Windows Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== VERIFYING WINDOWS BUILD ====="

          $exe = "build\windows\x64\runner\Release\$env:PROJECT_NAME.exe"

          if (-not (Test-Path $exe)) {
            throw "Windows executable was not generated: $exe"
          }

          Write-Host "OK: $exe"

      # ============================================================
      # PACKAGE
      # ============================================================

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== PACKAGING WINDOWS RELEASE ====="

          $source = "build\windows\x64\runner\Release"
          $output = "$env:PROJECT_NAME-Windows-Release.zip"

          if (-not (Test-Path $source)) {
            throw "Release directory does not exist: $source"
          }

          if (Test-Path $output) {
            Remove-Item -Force $output
          }

          Compress-Archive `
            -Path "$source\*" `
            -DestinationPath $output `
            -CompressionLevel Optimal

          if (-not (Test-Path $output)) {
            throw "Failed to create Windows release ZIP."
          }

          Write-Host "Created: $output"

      # ============================================================
      # VERIFY ZIP
      # ============================================================

      - name: Verify Windows Package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== VERIFYING WINDOWS PACKAGE ====="

          $output = "$env:PROJECT_NAME-Windows-Release.zip"

          if (-not (Test-Path $output)) {
            throw "Windows ZIP package was not generated."
          }

          $size = (Get-Item $output).Length

          if ($size -le 0) {
            throw "Windows ZIP package is empty."
          }

          Write-Host "OK: $output"
          Write-Host "Size: $size bytes"

      # ============================================================
      # UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Release
          path: "*-Windows-Release.zip"
          if-no-files-found: error
