name: Windows Flutter Fixed Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixed-build:
    name: Windows Fixed Flutter Build
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Flutter Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER VERSION ====="
          flutter --version

      - name: Verify Windows Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS PROJECT CHECK ====="

          $required = @(
            "pubspec.yaml",
            "lib\main.dart",
            "lib\services\backup_service.dart",
            "lib\services\pdf_export_service.dart",
            "windows\CMakeLists.txt",
            "windows\flutter\CMakeLists.txt",
            "windows\runner\CMakeLists.txt",
            "windows\runner\main.cpp",
            "windows\runner\flutter_window.cpp",
            "windows\runner\flutter_window.h"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file is missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Windows project structure is valid."

      - name: Flutter Clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER CLEAN ====="

          flutter clean

          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

          if (Test-Path ".dart_tool") {
            Remove-Item -Recurse -Force ".dart_tool"
          }

          if (Test-Path "windows\flutter\ephemeral") {
            Remove-Item `
              -Recurse `
              -Force `
              "windows\flutter\ephemeral"
          }

          Write-Host "Generated files cleaned."

      - name: Create Temporary Windows Dependency Overrides
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS DEPENDENCY OVERRIDES ====="

          @"
          dependency_overrides:
            flutter_secure_storage: 10.3.1
            flutter_secure_storage_windows: 4.2.2
            file_picker: 12.0.0-beta.7
          "@ | Set-Content `
            -Path "pubspec_overrides.yaml" `
            -Encoding UTF8

          Get-Content "pubspec_overrides.yaml"

      - name: Flutter Pub Get
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER PUB GET ====="

          flutter pub get

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter pub get failed."
          }

          Write-Host ""
          Write-Host "===== PUB GET PASSED ====="

      - name: Show Resolved Windows Dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== RESOLVED WINDOWS DEPENDENCIES ====="

          flutter pub deps --style=compact

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to read resolved dependency tree."
          }

          Write-Host ""
          Write-Host "Dependency tree generated successfully."

      - name: Temporary Windows FilePicker Compatibility Patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS FILEPICKER COMPATIBILITY ====="

          $files = @(
            "lib\services\backup_service.dart",
            "lib\services\pdf_export_service.dart"
          )

          foreach ($file in $files) {

            $content = Get-Content `
              -Path $file `
              -Raw `
              -Encoding UTF8

            $original = $content

            $content = $content.Replace(
              "FilePicker.platform.saveFile",
              "FilePicker.saveFile"
            )

            $content = $content.Replace(
              "FilePicker.platform.pickFiles",
              "FilePicker.pickFiles"
            )

            if ($content -ne $original) {

              Set-Content `
                -Path $file `
                -Value $content `
                -Encoding UTF8

              Write-Host "Patched: $file"
            }
            else {
              Write-Host "No FilePicker.platform usage changed: $file"
            }
          }

          Write-Host ""
          Write-Host "FilePicker compatibility patch completed."

      - name: Remove Known Unused PDF Helpers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== REMOVING KNOWN UNUSED HELPERS ====="

          $file = "lib\services\pdf_export_service.dart"

          if (-not (Test-Path $file)) {
            throw "PDF export service not found."
          }

          $content = Get-Content `
            -Path $file `
            -Raw `
            -Encoding UTF8

          $pattern = '(?ms)\r?\n\s*bool _containsLtr\(String value\)\s*\{.*?\r?\n\s*\}\r?\n\r?\n\s*bool _containsNumber\(String value\)\s*\{.*?\r?\n\s*\}'

          $updated = [regex]::Replace(
            $content,
            $pattern,
            ""
          )

          if ($updated -ne $content) {

            Set-Content `
              -Path $file `
              -Value $updated `
              -Encoding UTF8

            Write-Host "Known unused helpers removed."
          }
          else {
            Write-Host "Unused helper block was already absent."
          }

      - name: Verify Legacy FilePicker API Is Gone
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== VERIFYING FILEPICKER API ====="

          $files = @(
            "lib\services\backup_service.dart",
            "lib\services\pdf_export_service.dart"
          )

          foreach ($file in $files) {

            $content = Get-Content `
              -Path $file `
              -Raw `
              -Encoding UTF8

            if ($content -match "FilePicker\.platform") {
              throw "Legacy FilePicker.platform API still exists in: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Legacy FilePicker API check passed."

      - name: Flutter Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER ANALYZE ====="

          flutter analyze

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter analyze failed."
          }

          Write-Host ""
          Write-Host "===== FLUTTER ANALYZE PASSED ====="

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== BUILDING WINDOWS RELEASE ====="

          flutter build windows --release

          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed."
          }

          Write-Host ""
          Write-Host "===== WINDOWS BUILD PASSED ====="

      - name: Verify Windows Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== VERIFYING WINDOWS EXECUTABLE ====="

          $exe = "build\windows\x64\runner\Release\pass_managers.exe"

          if (-not (Test-Path $exe)) {
            throw "Windows executable was not generated: $exe"
          }

          $info = Get-Item $exe

          Write-Host "OK: $($info.FullName)"
          Write-Host "Size: $($info.Length) bytes"

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== PACKAGING WINDOWS RELEASE ====="

          $source = "build\windows\x64\runner\Release"
          $output = "Pass-Managers-Windows-Fixed-Release.zip"

          if (-not (Test-Path $source)) {
            throw "Windows release directory does not exist."
          }

          if (Test-Path $output) {
            Remove-Item -Force $output
          }

          Compress-Archive `
            -Path "$source\*" `
            -DestinationPath $output `
            -CompressionLevel Optimal

          if (-not (Test-Path $output)) {
            throw "Windows release ZIP was not created."
          }

          Write-Host "Created: $output"

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Fixed-Release
          path: Pass-Managers-Windows-Fixed-Release.zip
          if-no-files-found: error

      - name: Cleanup Temporary Windows Changes
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          Write-Host "===== CLEANUP ====="

          if (Test-Path "pubspec_overrides.yaml") {
            Remove-Item `
              -Force `
              "pubspec_overrides.yaml"

            Write-Host "Temporary dependency overrides removed."
          }

          Write-Host "Cleanup completed."
