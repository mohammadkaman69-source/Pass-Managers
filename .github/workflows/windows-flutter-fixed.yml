name: Windows Flutter Fixed Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-fixed-build:
    name: Windows Fixed Flutter Build
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Flutter Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER VERSION ====="

          flutter --version

      - name: Verify Windows Project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS PROJECT CHECK ====="

          $required = @(
            "pubspec.yaml",
            "lib\main.dart",
            "lib\services\backup_service.dart",
            "lib\services\pdf_export_service.dart",
            "windows\CMakeLists.txt",
            "windows\flutter\CMakeLists.txt",
            "windows\runner\CMakeLists.txt",
            "windows\runner\main.cpp",
            "windows\runner\flutter_window.cpp",
            "windows\runner\flutter_window.h"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required file is missing: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "Windows project structure is valid."

      - name: Flutter Clean
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER CLEAN ====="

          flutter clean

          if (Test-Path "build") {
            Remove-Item -Recurse -Force "build"
          }

          if (Test-Path ".dart_tool") {
            Remove-Item -Recurse -Force ".dart_tool"
          }

          if (Test-Path "windows\flutter\ephemeral") {
            Remove-Item `
              -Recurse `
              -Force `
              "windows\flutter\ephemeral"
          }

          Write-Host ""
          Write-Host "Flutter generated files cleaned."

      - name: Create Windows Dependency Overrides
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS DEPENDENCY OVERRIDES ====="

          @"
          dependency_overrides:
            flutter_secure_storage: 10.3.1
            flutter_secure_storage_windows: 4.2.2
            file_picker: 12.0.0-beta.7
          "@ | Set-Content `
            -Path "pubspec_overrides.yaml" `
            -Encoding UTF8

          Write-Host ""
          Get-Content "pubspec_overrides.yaml"

      - name: Flutter Pub Get
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER PUB GET ====="

          flutter pub get

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter pub get failed."
          }

          Write-Host ""
          Write-Host "===== FLUTTER PUB GET PASSED ====="

      - name: Verify Windows Dependency Resolution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== RESOLVED WINDOWS DEPENDENCIES ====="

          $deps = flutter pub deps --style=compact

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve dependency tree."
          }

          Write-Host $deps

          $requiredVersions = @(
            "flutter_secure_storage 10.3.1",
            "flutter_secure_storage_windows 4.2.2",
            "file_picker 12.0.0-beta.7"
          )

          foreach ($required in $requiredVersions) {
            if ($deps -notmatch [regex]::Escape($required)) {
              throw "Required dependency was not resolved: $required"
            }

            Write-Host "OK: $required"
          }

          Write-Host ""
          Write-Host "Windows dependency resolution passed."

      - name: Patch Windows File Picker API In Temporary Workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== WINDOWS FILE PICKER API PATCH ====="

          $files = @(
            "lib\services\backup_service.dart",
            "lib\services\pdf_export_service.dart"
          )

          foreach ($file in $files) {

            if (-not (Test-Path $file)) {
              throw "File does not exist: $file"
            }

            $content = Get-Content `
              -Path $file `
              -Raw `
              -Encoding UTF8

            $original = $content

            $content = $content.Replace(
              "FilePicker.platform.saveFile",
              "FilePicker.saveFile"
            )

            $content = $content.Replace(
              "FilePicker.platform.pickFiles",
              "FilePicker.pickFiles"
            )

            if ($content -eq $original) {
              Write-Host "No FilePicker API replacement was required in: $file"
            }
            else {
              Set-Content `
                -Path $file `
                -Value $content `
                -Encoding UTF8

              Write-Host "Patched: $file"
            }
          }

          Write-Host ""
          Write-Host "Temporary Windows API compatibility patch completed."

      - name: Verify File Picker API Patch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== VERIFYING FILE PICKER API ====="

          $files = @(
            "lib\services\backup_service.dart",
            "lib\services\pdf_export_service.dart"
          )

          foreach ($file in $files) {

            $content = Get-Content `
              -Path $file `
              -Raw `
              -Encoding UTF8

            if ($content -match "FilePicker\.platform") {
              throw "Old FilePicker.platform API still exists in: $file"
            }

            Write-Host "OK: $file"
          }

          Write-Host ""
          Write-Host "No legacy FilePicker.platform API remains."

      - name: Flutter Analyze
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== FLUTTER ANALYZE ====="

          flutter analyze

          if ($LASTEXITCODE -ne 0) {
            throw "Flutter analyze failed."
          }

          Write-Host ""
          Write-Host "===== FLUTTER ANALYZE PASSED ====="

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== BUILDING WINDOWS RELEASE ====="

          flutter build windows --release

          if ($LASTEXITCODE -ne 0) {
            throw "Windows release build failed."
          }

          Write-Host ""
          Write-Host "===== WINDOWS BUILD PASSED ====="

      - name: Verify Windows Executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== VERIFYING WINDOWS BUILD ====="

          $exe = "build\windows\x64\runner\Release\pass_managers.exe"

          if (-not (Test-Path $exe)) {
            throw "Windows executable was not generated: $exe"
          }

          Write-Host ""
          Write-Host "OK: $exe"

          Get-Item $exe |
            Select-Object FullName, Length

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "===== PACKAGING WINDOWS RELEASE ====="

          $source = "build\windows\x64\runner\Release"
          $output = "Pass-Managers-Windows-Fixed-Release.zip"

          if (-not (Test-Path $source)) {
            throw "Windows Release directory does not exist: $source"
          }

          if (Test-Path $output) {
            Remove-Item `
              -Force `
              $output
          }

          Compress-Archive `
            -Path "$source\*" `
            -DestinationPath $output `
            -CompressionLevel Optimal

          if (-not (Test-Path $output)) {
            throw "Failed to create Windows release ZIP."
          }

          Write-Host ""
          Write-Host "Created: $output"

          Get-Item $output |
            Select-Object FullName, Length

      - name: Remove Temporary Windows Changes
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "SilentlyContinue"

          Write-Host "===== CLEANUP ====="

          if (Test-Path "pubspec_overrides.yaml") {
            Remove-Item `
              -Force `
              "pubspec_overrides.yaml"

            Write-Host "Removed temporary pubspec_overrides.yaml."
          }

          Write-Host ""
          Write-Host "Runner workspace cleanup completed."

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Fixed-Release
          path: Pass-Managers-Windows-Fixed-Release.zip
          if-no-files-found: error
