name: Recreate Windows Platform

"on":
  workflow_dispatch:

jobs:
  recreate-windows:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          channel: stable


      - name: Verify Flutter
        run: |
          flutter --version


      - name: Create Windows platform
        run: |
          flutter create \
            --platforms=windows \
            --project-name pass_managers \
            .


      - name: Verify Windows files
        run: |
          ls -la windows
          ls -la windows/runner


      - name: Check old Visual Studio reference
        run: |
          grep -R "Visual Studio 16 2019" windows || true


      - name: Commit Windows platform
        run: |
          git config user.name "AI-Agent"
          git config user.email "actions@github.com"

          git add windows

          git commit -m "Recreate Windows platform clean" || echo "No changes"

          git push
