name: Pass Managers Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-build:
    name: Android Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Verify Android SDK tools
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if command -v sdkmanager >/dev/null 2>&1; then
            echo "sdkmanager found in PATH:"
            command -v sdkmanager
          else
            echo "sdkmanager was not found in PATH."

            SDKMANAGER=""

            if [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
            elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            fi

            if [ -z "$SDKMANAGER" ]; then
              find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" \
                -type f \
                -name sdkmanager \
                -print 2>/dev/null || true

              exit 1
            fi

            SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

            echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"

            echo "Using sdkmanager:"
            echo "$SDKMANAGER"
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -euo pipefail

          yes | flutter doctor --android-licenses || true

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -n "${ANDROID_HOME:-}" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ] && [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            echo "ERROR: sdkmanager could not be located."
            exit 1
          fi

          echo "Using SDK manager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;35.0.0"

      - name: Flutter doctor
        shell: bash
        run: |
          set -euo pipefail

          flutter doctor -v

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      - name: Verify Android compile SDK configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/build.gradle || {
            echo "ERROR: android/app/build.gradle is missing."
            exit 1
          }

          echo "Checking Android build configuration..."

          grep -n "compileSdk" android/app/build.gradle || true

      - name: Analyze Flutter project
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  windows-build:
    name: Windows Release
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Verify Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter --version
          flutter doctor -v

      - name: Get Flutter dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter pub get

      - name: Verify Windows project before repair
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "pubspec.yaml")) {
            throw "pubspec.yaml is missing."
          }

          if (-not (Test-Path "lib")) {
            throw "lib directory is missing."
          }

          Write-Host "Checking Windows platform..."

          if (Test-Path "windows/CMakeLists.txt") {
            Write-Host "windows/CMakeLists.txt exists."
          }
          else {
            Write-Host "windows/CMakeLists.txt is missing."
          }

      - name: Repair Windows platform
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          Write-Host "Recreating Flutter Windows platform files..."

          flutter create --platforms=windows .

          if (-not (Test-Path "windows/CMakeLists.txt")) {
            throw "windows/CMakeLists.txt is still missing after flutter create."
          }

          if (-not (Test-Path "windows/flutter/CMakeLists.txt")) {
            throw "windows/flutter/CMakeLists.txt is missing."
          }

          if (-not (Test-Path "windows/runner")) {
            throw "windows/runner directory is missing."
          }

          Write-Host "Windows platform repaired successfully."

      - name: Analyze Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter analyze

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "build/windows/x64/runner/Release")) {
            throw "Windows Release directory was not generated."
          }

          Write-Host "Windows Release generated successfully."

          Get-ChildItem `
            "build/windows/x64/runner/Release" `
            -Recurse |
            Select-Object FullName, Length

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "build/windows/x64/runner/Release"
          $destination = "build/Pass-Managers-Windows-Release.zip"

          if (-not (Test-Path $source)) {
            throw "Windows Release directory does not exist."
          }

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Windows ZIP was not created."
          }

          Get-Item $destination |
            Select-Object FullName, Length

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Release
          path: build/Pass-Managers-Windows-Release.zip
          if-no-files-found: error
