name: Pass Managers Build

"on":
  workflow_dispatch:

jobs:

  android-build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Inspect Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "===== CURRENT DIRECTORY ====="
          pwd

          echo
          echo "===== ROOT FILES ====="
          find . -maxdepth 2 -type f \
            -not -path './.git/*' \
            | sort

          echo
          echo "===== ANDROID FILES ====="
          find android -type f | sort

          echo
          echo "===== CHECK BUILD FILES ====="

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "FOUND: android/app/build.gradle.kts"
            echo
            cat android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            echo "FOUND: android/app/build.gradle"
            echo
            cat android/app/build.gradle
          else
            echo "ERROR: Neither build.gradle.kts nor build.gradle exists."
            exit 1
          fi

      - name: Verify compileSdk
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "android/app/build.gradle.kts" ]; then
            echo "Checking Kotlin Gradle file..."

            if grep -qE 'compileSdk[[:space:]]*=[[:space:]]*36' \
              android/app/build.gradle.kts; then

              echo "SUCCESS: compileSdk = 36"

            else
              echo "ERROR: compileSdk = 36 was NOT found."
              echo
              echo "Actual compileSdk lines:"
              grep -n "compileSdk" android/app/build.gradle.kts || true
              exit 1
            fi

          elif [ -f "android/app/build.gradle" ]; then
            echo "Checking Groovy Gradle file..."

            if grep -qE 'compileSdk[[:space:]]+36' \
              android/app/build.gradle; then

              echo "SUCCESS: compileSdk 36"

            else
              echo "ERROR: compileSdk 36 was NOT found."
              echo
              echo "Actual compileSdk lines:"
              grep -n "compileSdk" android/app/build.gradle || true
              exit 1
            fi

          else
            echo "ERROR: Android Gradle file not found."
            exit 1
          fi

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "android/settings.gradle"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
            "android/app/src/main/kotlin/com/example/pass_managers/MainActivity.kt"
          )

          for file in "${required[@]}"; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              exit 1
            fi
          done

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ -f "$APK" ]; then
            echo "APK successfully created:"
            ls -lh "$APK"
          else
            echo "ERROR: APK was not created."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Android
          path: build/app/outputs/flutter-apk/app-release.apk
