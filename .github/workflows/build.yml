name: Pass Managers Build

"on":
  workflow_dispatch:

jobs:

  windows-build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Configure Visual Studio 2026
        shell: powershell
        run: |
          $vsPath = "C:\Program Files\Microsoft Visual Studio\18\Enterprise"

          if (-not (Test-Path $vsPath)) {
            Write-Error "Visual Studio 2026 Enterprise was not found at $vsPath"
            exit 1
          }

          $env:CMAKE_GENERATOR = "Visual Studio 18 2026"
          $env:CMAKE_GENERATOR_PLATFORM = "x64"

          "CMAKE_GENERATOR=Visual Studio 18 2026" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_GENERATOR_PLATFORM=x64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          Write-Host "Visual Studio path: $vsPath"
          Write-Host "CMAKE_GENERATOR: Visual Studio 18 2026"
          Write-Host "CMAKE_GENERATOR_PLATFORM: x64"

      - name: Clean Windows build cache
        shell: powershell
        run: |
          if (Test-Path "build/windows") {
            Remove-Item -Recurse -Force "build/windows"
          }

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Windows
          path: build/windows/x64/runner/Release/


  android-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Android
          path: build/app/outputs/flutter-apk/app-release.apk
