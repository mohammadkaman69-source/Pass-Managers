name: Pass Managers Build

run-name: Pass Managers Build - ${{ github.actor }}

"on":
workflow_dispatch:

jobs:

android-build:
name: Pass Managers - Android
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: "3.32.8"
      channel: stable

  - name: Get dependencies
    run: flutter pub get

  - name: Analyze
    run: flutter analyze

  - name: Build APK
    run: flutter build apk --release

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: PassManagers-Android
      path: build/app/outputs/flutter-apk/app-release.apk

windows-build:
name: Pass Managers - Windows
runs-on: windows-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup Flutter
    uses: subosito/flutter-action@v2
    with:
      flutter-version: "3.32.8"
      channel: stable

  - name: Show Flutter version
    run: flutter --version

  - name: Show CMake version
    run: cmake --version

  - name: Get dependencies
    run: flutter pub get

  - name: Analyze
    run: flutter analyze

  - name: Remove old Windows build cache
    shell: pwsh
    run: |
      if (Test-Path "build/windows") {
        Remove-Item -Recurse -Force "build/windows"
      }

  - name: Build Windows
    shell: pwsh
    env:
      CMAKE_GENERATOR: "Visual Studio 18 2026"
    run: |
      flutter build windows --release -v

  - name: Upload Windows Build
    uses: actions/upload-artifact@v4
    with:
      name: PassManagers-Windows
      path: build/windows/x64/runner/Release/
