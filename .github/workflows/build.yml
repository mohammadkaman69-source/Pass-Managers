name: Pass Managers Build

"on":
  workflow_dispatch:

jobs:

  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Recreate Windows platform
        shell: pwsh
        run: |
          if (Test-Path windows) {
            Remove-Item -Recurse -Force windows
          }

          flutter create --platforms=windows --project-name pass_managers .

      - name: Remove generated sample test
        shell: pwsh
        run: |
          if (Test-Path test) {
            Remove-Item -Recurse -Force test
          }

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check Visual Studio
        run: flutter doctor -v

      - name: Build Windows
        run: flutter build windows --release -v

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Windows
          path: build/windows/x64/runner/Release/


  android-build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Android
        run: flutter config --enable-android

      # IMPORTANT:
      # Do NOT delete/recreate the android directory here.
      # The project contains custom native Android code in
      # MainActivity.kt for the PDF Storage Access Framework.
      - name: Verify Android native integration
        shell: bash
        run: |
          test -f android/app/src/main/kotlin/com/example/pass_managers/MainActivity.kt

          grep -q 'pass_managers/file_saver' \
            android/app/src/main/kotlin/com/example/pass_managers/MainActivity.kt

          grep -q 'savePdf' \
            android/app/src/main/kotlin/com/example/pass_managers/MainActivity.kt

      - name: Remove generated sample test
        run: |
          rm -rf test

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Android
          path: build/app/outputs/flutter-apk/app-release.apk
