name: Pass Managers Build

"on":
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.7"

jobs:
  android-build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download Flutter SDK
        shell: bash
        run: |
          set -euo pipefail

          url="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          archive="$RUNNER_TEMP/flutter.tar.xz"
          sdk="$RUNNER_TEMP/flutter"

          rm -rf "$sdk"
          mkdir -p "$sdk"

          curl --fail --location --retry 5 --retry-all-errors --retry-delay 3 \
            -o "$archive" "$url"

          tar -xJf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Verify Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter --version

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Flutter SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $url = "https://storage.googleapis.com/flutter_infra_release/releases/stable/windows/flutter_windows_${env:FLUTTER_VERSION}-stable.zip"
          $archive = Join-Path $env:RUNNER_TEMP "flutter.zip"
          $sdkRoot = Join-Path $env:RUNNER_TEMP "flutter"

          if (Test-Path $sdkRoot) {
            Remove-Item -Recurse -Force $sdkRoot
          }

          Invoke-WebRequest -Uri $url -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath $env:RUNNER_TEMP -Force

          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $sdkRoot "bin")

      - name: Verify Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Verify Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "windows/CMakeLists.txt")) {
            throw "windows/CMakeLists.txt is missing."
          }

          if (!(Test-Path "windows/flutter/CMakeLists.txt")) {
            throw "windows/flutter/CMakeLists.txt is missing."
          }

          if (!(Test-Path "windows/runner/CMakeLists.txt")) {
            throw "windows/runner/CMakeLists.txt is missing."
          }

          Write-Host "Windows project files are present."

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build Windows
        run: flutter build windows --release

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Windows
          path: build/windows/x64/runner/Release/
