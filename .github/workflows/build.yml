name: Pass Managers Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    name: Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;35.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          java -version
          flutter doctor -v

          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager is unavailable after setup-android."
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          test -d "${ANDROID_HOME}/platforms/android-36"
          test -d "${ANDROID_HOME}/build-tools/35.0.0"

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'compileSdk = 36' android/app/build.gradle
          grep -q 'applicationId = "com.example.pass_managers"' android/app/build.gradle
          grep -q 'namespace = "com.example.pass_managers"' android/app/build.gradle
          grep -q 'VERSION_17' android/app/build.gradle

      - name: Analyze Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-build:
    name: Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Verify Windows project before build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "pubspec.yaml",
            "windows/CMakeLists.txt",
            "windows/flutter/CMakeLists.txt",
            "windows/runner/CMakeLists.txt",
            "windows/runner/main.cpp",
            "windows/runner/flutter_window.cpp",
            "windows/runner/flutter_window.h"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required Windows project file is missing: $file"
            }
          }

          $cmake = Get-Content "windows/CMakeLists.txt" -Raw
          if ($cmake -notmatch "function\(APPLY_STANDARD_SETTINGS TARGET\)") {
            throw "APPLY_STANDARD_SETTINGS is missing from windows/CMakeLists.txt"
          }

          if ($cmake -notmatch "_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS") {
            throw "Windows coroutine deprecation suppression is missing."
          }

          if ($cmake -notmatch "cxx_std_20") {
            throw "Windows C++20 configuration is missing."
          }

      - name: Get Flutter dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter pub get

      - name: Verify Windows plugin registration
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path "windows/flutter/generated_plugins.cmake")) {
            throw "Flutter did not generate windows/flutter/generated_plugins.cmake."
          }
          if (-not (Test-Path "windows/flutter/generated_plugin_registrant.cc")) {
            throw "Flutter did not generate the Windows plugin registrant."
          }

      - name: Analyze Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter analyze

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $release = "build/windows/x64/runner/Release"
          if (-not (Test-Path $release)) {
            throw "Windows Release directory was not generated."
          }
          Get-ChildItem $release -Recurse | Select-Object FullName, Length

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "build/windows/x64/runner/Release"
          $destination = "build/Pass-Managers-Windows-Release.zip"
          if (-not (Test-Path $source)) {
            throw "Windows Release directory does not exist."
          }
          if (Test-Path $destination) {
            Remove-Item $destination -Force
          }
          Compress-Archive -Path "$source/*" -DestinationPath $destination -Force
          if (-not (Test-Path $destination)) {
            throw "Windows ZIP was not created."
          }
          Get-Item $destination | Select-Object FullName, Length

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Release
          path: build/Pass-Managers-Windows-Release.zip
          if-no-files-found: error
