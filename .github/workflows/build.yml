name: Pass Managers Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-build:
    name: Android Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          if [ -n "${ANDROID_HOME:-}" ]; then
            echo "Android SDK:"
            ls -la "$ANDROID_HOME" || true
          fi

          echo
          echo "Installed Android platforms:"
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/platforms" ]; then
            ls -la "$ANDROID_HOME/platforms"
          fi

          echo
          echo "Installed build tools:"
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/build-tools" ]; then
            ls -la "$ANDROID_HOME/build-tools"
          fi

      - name: Flutter doctor
        shell: bash
        run: |
          set -euo pipefail
          flutter doctor -v

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Verify Android project files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "pubspec.yaml"
            "android/settings.gradle"
            "android/app/build.gradle"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "ERROR: Missing Android file: $file"
              exit 1
            fi
          done

          echo "All required Android project files exist."

      - name: Verify Android compile SDK
        shell: bash
        run: |
          set -euo pipefail

          echo "Android compileSdk configuration:"
          grep -n "compileSdk" android/app/build.gradle || true

          if ! grep -q "compileSdk = 36" android/app/build.gradle; then
            echo "ERROR: android/app/build.gradle must contain:"
            echo "compileSdk = 36"
            exit 1
          fi

      - name: Analyze Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo "Android APK generated successfully:"
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  windows-build:
    name: Windows Release
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Verify Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter --version
          flutter doctor -v

      - name: Verify Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $required = @(
            "pubspec.yaml",
            "windows/CMakeLists.txt",
            "windows/flutter/CMakeLists.txt",
            "windows/runner",
            "windows/runner/CMakeLists.txt",
            "windows/runner/main.cpp",
            "windows/runner/flutter_window.cpp",
            "windows/runner/flutter_window.h"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required Windows project file is missing: $file"
            }
          }

          Write-Host "Windows project files are present."

      - name: Get Flutter dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter pub get

      - name: Analyze Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter analyze

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = "build/windows/x64/runner/Release"

          if (-not (Test-Path $release)) {
            throw "Windows Release directory was not generated."
          }

          Write-Host "Windows Release generated successfully."

          Get-ChildItem `
            $release `
            -Recurse |
            Select-Object FullName, Length

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "build/windows/x64/runner/Release"
          $destination = "build/Pass-Managers-Windows-Release.zip"

          if (-not (Test-Path $source)) {
            throw "Windows Release directory does not exist."
          }

          if (Test-Path $destination) {
            Remove-Item $destination -Force
          }

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Windows ZIP was not created."
          }

          Write-Host "Windows ZIP created successfully:"
          Get-Item $destination |
            Select-Object FullName, Length

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Release
          path: build/Pass-Managers-Windows-Release.zip
          if-no-files-found: error
