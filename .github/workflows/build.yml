name: Pass Managers Build

"on":
  workflow_dispatch:

jobs:

  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Remove generated sample test
        shell: pwsh
        run: |
          if (Test-Path test) {
            Remove-Item -Recurse -Force test
          }

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Check Visual Studio
        run: flutter doctor -v

      - name: Build Windows
        run: flutter build windows --release -v

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Windows
          path: build/windows/x64/runner/Release/


  android-build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable

      - name: Show Flutter version
        run: flutter --version

      - name: Enable Android
        run: flutter config --enable-android

      # IMPORTANT:
      # Do NOT delete or recreate the android directory.
      # The Android project in the repository contains our custom
      # Gradle, Kotlin, biometric, PDF and native configuration.

      - name: Verify Android compileSdk configuration
        shell: bash
        run: |
          set -euo pipefail

          test -f android/app/build.gradle.kts

          echo "===== android/app/build.gradle.kts ====="
          cat android/app/build.gradle.kts

          grep -q 'compileSdk = 36' android/app/build.gradle.kts

      - name: Verify Android project files
        shell: bash
        run: |
          set -euo pipefail

          test -f android/settings.gradle
          test -f android/app/build.gradle.kts
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/kotlin/com/example/pass_managers/MainActivity.kt

      - name: Clean Flutter
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Show Android configuration
        shell: bash
        run: |
          set -euo pipefail

          echo "===== compileSdk ====="
          grep -n "compileSdk" android/app/build.gradle.kts

          echo
          echo "===== Gradle wrapper ====="
          cat android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Android
          path: build/app/outputs/flutter-apk/app-release.apk
