name: Pass Managers Build

"on":
  workflow_dispatch:

jobs:

  windows-build:
    name: Windows Build
    runs-on: windows-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable


      - name: Flutter version
        run: flutter --version


      - name: Flutter doctor
        run: flutter doctor -v


      - name: Get dependencies
        run: flutter pub get


      - name: Clean Flutter
        run: flutter clean


      - name: Remove old build cache
        shell: powershell
        run: |
          if (Test-Path build) {
            Remove-Item -Recurse -Force build
          }


      - name: Analyze
        run: flutter analyze


      - name: Build Windows
        run: flutter build windows --release -v


      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Windows
          path: build/windows/x64/runner/Release/



  android-build:
    name: Android Build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout source
        uses: actions/checkout@v4


      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable


      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Flutter version
        run: flutter --version


      - name: Get dependencies
        run: flutter pub get


      - name: Analyze
        run: flutter analyze


      - name: Build APK
        run: flutter build apk --release


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PassManagers-Android
          path: build/app/outputs/flutter-apk/app-release.apk
