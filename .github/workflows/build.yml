name: Pass Managers Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-build:
    name: Android Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;35.0.0
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android environment
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FLUTTER ====="
          flutter --version

          echo
          echo "===== JAVA ====="
          java -version

          echo
          echo "===== ANDROID ====="
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"

          command -v sdkmanager
          sdkmanager --version

          echo
          echo "===== INSTALLED SDK ====="
          sdkmanager --list_installed | grep -E \
            'platform-tools|platforms;android-36|build-tools;35' \
            || true

      - name: Verify Android project files
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml

          if [ -f android/app/build.gradle.kts ]; then
            echo "Using android/app/build.gradle.kts"
            grep -n "compileSdk" android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            echo "Using android/app/build.gradle"
            grep -n "compileSdk" android/app/build.gradle
          else
            echo "ERROR: Android app Gradle file was not found."
            exit 1
          fi

          test -f android/settings.gradle || \
          test -f android/settings.gradle.kts

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail

          flutter pub get

      - name: Analyze Flutter project
        shell: bash
        run: |
          set -euo pipefail

          flutter analyze

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          flutter build apk --release

      - name: Verify Android APK
        shell: bash
        run: |
          set -euo pipefail

          APK="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error


  windows-build:
    name: Windows Release
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Verify Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter --version
          flutter doctor -v

      - name: Verify Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path "pubspec.yaml")) {
            throw "pubspec.yaml is missing."
          }

          if (-not (Test-Path "lib")) {
            throw "lib directory is missing."
          }

          $required = @(
            "windows/CMakeLists.txt",
            "windows/flutter/CMakeLists.txt",
            "windows/runner/CMakeLists.txt",
            "windows/runner/main.cpp",
            "windows/runner/flutter_window.cpp",
            "windows/runner/flutter_window.h",
            "windows/runner/utils.cpp",
            "windows/runner/utils.h",
            "windows/runner/win32_window.cpp",
            "windows/runner/win32_window.h"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required Windows file is missing: $file"
            }
          }

          Write-Host "Windows project structure is present."

      - name: Get Flutter dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter pub get

      - name: Analyze Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter analyze

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $release = "build/windows/x64/runner/Release"

          if (-not (Test-Path $release)) {
            throw "Windows Release directory was not generated."
          }

          Write-Host "Windows Release generated successfully."

          Get-ChildItem `
            $release `
            -Recurse |
            Select-Object FullName, Length

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $source = "build/windows/x64/runner/Release"
          $destination = "build/Pass-Managers-Windows-Release.zip"

          if (-not (Test-Path $source)) {
            throw "Windows Release directory does not exist."
          }

          Compress-Archive `
            -Path "$source/*" `
            -DestinationPath $destination `
            -Force

          if (-not (Test-Path $destination)) {
            throw "Windows ZIP was not created."
          }

          Get-Item $destination |
            Select-Object FullName, Length

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Release
          path: build/Pass-Managers-Windows-Release.zip
          if-no-files-found: error
