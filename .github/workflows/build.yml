name: Pass Managers Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:

  android-build:
    name: Android Release APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then echo "ERROR: Android SDK root is not defined."; exit 1; fi
          if [ ! -d "$SDK_ROOT/platform-tools" ]; then echo "ERROR: platform-tools is missing."; exit 1; fi
          if [ ! -d "$SDK_ROOT/platforms/android-36" ]; then echo "ERROR: Android platform 36 is missing."; exit 1; fi
          if [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then echo "ERROR: Android Build Tools 36.0.0 is missing."; exit 1; fi
          echo "Android SDK verification successful."

      - name: Flutter doctor
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          java -version
          flutter doctor -v

      - name: Get Flutter dependencies
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get

      - name: Generate Android launcher icons
        shell: bash
        run: |
          set -euo pipefail
          dart run flutter_launcher_icons
          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          echo "Android launcher icons generated successfully."

      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail
          REQUIRED_FILES=("pubspec.yaml" "android/settings.gradle" "android/build.gradle" "android/app/build.gradle" "android/gradle.properties" "android/gradle/wrapper/gradle-wrapper.properties" "android/app/src/main/AndroidManifest.xml")
          for FILE in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "$FILE" ]; then echo "ERROR: Required file is missing: $FILE"; exit 1; fi
          done
          grep -q 'compileSdk = 36' android/app/build.gradle || { echo "ERROR: compileSdk 36 was not found."; exit 1; }
          grep -q 'applicationId = "com.example.pass_managers"' android/app/build.gradle || { echo "ERROR: applicationId is incorrect."; exit 1; }
          grep -q 'namespace = "com.example.pass_managers"' android/app/build.gradle || { echo "ERROR: Android namespace is incorrect."; exit 1; }
          grep -q 'android:icon="@mipmap/ic_launcher"' android/app/src/main/AndroidManifest.xml || { echo "ERROR: Launcher icon is not configured as @mipmap/ic_launcher."; exit 1; }
          echo "Android project configuration is valid."

      - name: Configure permanent Android release signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is missing}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD secret is missing}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is missing}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is missing}"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > android/app/pass_managers_release.jks
          test -s android/app/pass_managers_release.jks

          echo "Decoded keystore size: $(wc -c < android/app/pass_managers_release.jks) bytes"
          keytool -list -v \
            -storetype PKCS12 \
            -keystore android/app/pass_managers_release.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            >/dev/null
          echo "Keystore validation successful."

          cat > android/key.properties <<EOF
          storeFile=app/pass_managers_release.jks
          storeType=PKCS12
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

          chmod 600 android/app/pass_managers_release.jks android/key.properties
          echo "Permanent release signing material configured."

      - name: Analyze Flutter project
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk --release

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -f "$APK" ]; then echo "ERROR: Release APK was not generated."; exit 1; fi
          ls -lh "$APK"

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/app/pass_managers_release.jks

  windows-build:
    name: Windows Release
    runs-on: windows-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true

      - name: Verify Flutter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter --version
          flutter doctor -v

      - name: Verify Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $requiredFiles = @("pubspec.yaml","lib/main.dart","windows/CMakeLists.txt","windows/flutter/CMakeLists.txt","windows/runner/CMakeLists.txt","windows/runner/main.cpp","windows/runner/flutter_window.cpp","windows/runner/flutter_window.h")
          foreach ($file in $requiredFiles) { if (-not (Test-Path $file)) { throw "Required Windows project file is missing: $file" } }
          if (Test-Path "windows/flutter/ephemeral") { Remove-Item "windows/flutter/ephemeral" -Recurse -Force }
          Write-Host "Windows project structure is valid."

      - name: Get Flutter dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter pub get

      - name: Analyze Flutter project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter analyze

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          flutter build windows --release

      - name: Verify Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releasePath = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releasePath)) { throw "Windows Release directory was not generated." }
          Get-ChildItem $releasePath -Recurse | Select-Object FullName, Length

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $source = "build/windows/x64/runner/Release"
          $destination = "build/Pass-Managers-Windows-Release.zip"
          if (-not (Test-Path $source)) { throw "Windows Release directory does not exist." }
          if (Test-Path $destination) { Remove-Item $destination -Force }
          Compress-Archive -Path "$source/*" -DestinationPath $destination -Force
          if (-not (Test-Path $destination)) { throw "Windows ZIP was not created." }
          Get-Item $destination | Select-Object FullName, Length

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Release
          path: build/Pass-Managers-Windows-Release.zip
          if-no-files-found: error
