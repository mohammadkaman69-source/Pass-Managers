name: Pass Managers Build

"on":
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  android-build:
    name: Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          accept-android-sdk-licenses: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Verify Android configuration
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'compileSdk = 36' android/app/build.gradle
          grep -q 'applicationId = "com.example.pass_managers"' android/app/build.gradle
          grep -q 'namespace = "com.example.pass_managers"' android/app/build.gradle

      - name: Build Android APK
        run: flutter build apk --release

      - name: Verify Android APK
        shell: bash
        run: test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Android-Release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows-build:
    name: Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.7
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Flutter test
        run: flutter test

      - name: Verify Windows project
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            'pubspec.yaml',
            'lib/main.dart',
            'windows/CMakeLists.txt',
            'windows/flutter/CMakeLists.txt',
            'windows/runner/CMakeLists.txt',
            'windows/runner/main.cpp',
            'windows/runner/flutter_window.cpp',
            'windows/runner/flutter_window.h'
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Required Windows project file is missing: $file" }
          }

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Verify Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $releasePath = 'build/windows/x64/runner/Release'
          if (-not (Test-Path $releasePath)) { throw 'Windows Release directory was not generated.' }

      - name: Package Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path 'build/windows/x64/runner/Release/*' -DestinationPath 'build/Pass-Managers-Windows-Release.zip' -Force
          if (-not (Test-Path 'build/Pass-Managers-Windows-Release.zip')) { throw 'Windows ZIP was not created.' }

      - name: Upload Windows Release
        uses: actions/upload-artifact@v4
        with:
          name: Pass-Managers-Windows-Release
          path: build/Pass-Managers-Windows-Release.zip
          if-no-files-found: error
