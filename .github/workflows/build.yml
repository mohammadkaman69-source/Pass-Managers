name: Replace Project From Clean ZIP

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    name: Replace project from clean ZIP
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.AI_GITHUB_TOKEN }}

      - name: Check repository
        shell: bash
        run: |
          set -euo pipefail

          echo "Repository:"
          git remote -v

          echo
          echo "Branch:"
          git branch --show-current

          echo
          echo "Current files:"
          find . \
            -path './.git' -prune \
            -o -type f -print \
            | sort

      - name: Verify clean ZIP exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "Pass-Managers-final-clean.zip" ]; then
            echo "ERROR: Pass-Managers-final-clean.zip was not found."
            echo
            echo "ZIP files currently available:"
            find . -maxdepth 2 -type f -iname '*.zip' -print
            exit 1
          fi

          echo "Clean ZIP found."

      - name: Inspect ZIP before changing anything
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pass_managers_zip
          mkdir -p /tmp/pass_managers_zip

          unzip -q "Pass-Managers-final-clean.zip" \
            -d /tmp/pass_managers_zip

          echo "===== ZIP CONTENT ====="

          find /tmp/pass_managers_zip \
            -type f \
            -print \
            | sort

          echo
          echo "===== DETECT PROJECT ROOT ====="

          if [ -f "/tmp/pass_managers_zip/pubspec.yaml" ]; then
            ROOT="/tmp/pass_managers_zip"
          else
            ROOT="$(find /tmp/pass_managers_zip \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print \
              | head -n 1)"
          fi

          if [ -z "${ROOT:-}" ]; then
            echo "ERROR: Could not find project root."
            exit 1
          fi

          if [ ! -f "$ROOT/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml not found in:"
            echo "$ROOT"
            exit 1
          fi

          echo "Project root:"
          echo "$ROOT"

          echo "CLEAN_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify critical project files
        shell: bash
        run: |
          set -euo pipefail

          required=(
            "pubspec.yaml"
            "pubspec.lock"
            "lib/main.dart"

            "lib/screens/home_page.dart"
            "lib/screens/table_page.dart"
            "lib/screens/tree_page.dart"

            "lib/services/backup_service.dart"
            "lib/services/pdf_export_service.dart"

            "lib/security/biometric_service.dart"
            "lib/security/security_guard.dart"
            "lib/security/security_manager.dart"

            "lib/models/tree_item.dart"
            "lib/repositories/tree_repository.dart"

            "android/settings.gradle"
            "android/app/build.gradle"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "android/app/src/main/AndroidManifest.xml"
            "android/app/src/main/kotlin/com/example/pass_managers/MainActivity.kt"

            "windows"
          )

          for path in "${required[@]}"; do
            if [ ! -e "$CLEAN_ROOT/$path" ]; then
              echo "ERROR: Required item missing from clean ZIP:"
              echo "$path"
              exit 1
            fi
          done

          echo "All critical project files are present."

      - name: Verify Windows project exists
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "$CLEAN_ROOT/windows" ]; then
            echo "ERROR: windows directory is missing."
            exit 1
          fi

          if [ ! -f "$CLEAN_ROOT/windows/CMakeLists.txt" ]; then
            echo "WARNING: windows/CMakeLists.txt is not present."

            echo
            echo "Windows ZIP contents:"
            find "$CLEAN_ROOT/windows" \
              -maxdepth 3 \
              -type f \
              -print \
              | sort
          fi

          echo "Windows directory detected."

      - name: Create replacement staging area
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/pass_managers_final
          mkdir -p /tmp/pass_managers_final

          rsync -a \
            "$CLEAN_ROOT/" \
            /tmp/pass_managers_final/

          rm -rf /tmp/pass_managers_final/.github

          echo "Staging area created."

      - name: Preserve GitHub workflow directory
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/pass_managers_workflows

          if [ -d ".github/workflows" ]; then
            cp -a .github/workflows/. \
              /tmp/pass_managers_workflows/
          fi

          echo "Existing workflow files preserved."

      - name: Replace project files safely
        shell: bash
        run: |
          set -euo pipefail

          echo "Removing old project files..."

          find . \
            -mindepth 1 \
            -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'Pass-Managers-final-clean.zip' \
            -exec rm -rf {} +

          echo "Installing clean project..."

          rsync -a \
            /tmp/pass_managers_final/ \
            ./

          echo "Restoring workflow directory..."

          mkdir -p .github/workflows

          if [ -d "/tmp/pass_managers_workflows" ]; then
            cp -a /tmp/pass_managers_workflows/. \
              .github/workflows/
          fi

          echo "Replacement completed."

      - name: Remove ZIP from repository
        shell: bash
        run: |
          set -euo pipefail

          rm -f Pass-Managers-final-clean.zip

          echo "Temporary ZIP removed."

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail

          echo "===== FINAL PROJECT STRUCTURE ====="

          find . \
            -path './.git' -prune \
            -o -type f -print \
            | sort

          echo
          echo "===== VERIFY WINDOWS ====="

          test -d windows

          echo
          echo "===== VERIFY ANDROID ====="

          test -d android
          test -f android/settings.gradle
          test -f android/app/build.gradle

          echo
          echo "===== VERIFY FLUTTER ====="

          test -f pubspec.yaml
          test -d lib

          echo
          echo "Project structure verified."

      - name: Remove known unwanted files
        shell: bash
        run: |
          set -euo pipefail

          unwanted=(
            "AI_REPORT.json"
            "ai-report.txt"
            "test/widget_test.dart"
          )

          for file in "${unwanted[@]}"; do
            if [ -e "$file" ]; then
              rm -rf "$file"
              echo "Removed: $file"
            fi
          done

      - name: Show Git changes
        shell: bash
        run: |
          set -euo pipefail

          echo "===== GIT STATUS ====="
          git status --short

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit \
            -m "Replace project with clean final project"

      - name: Push replacement
        shell: bash
        run: |
          set -euo pipefail

          git push origin HEAD:main
