name: Clean and Regenerate Windows

"on":
  workflow_dispatch:

jobs:
  fix-windows:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Remove old Windows files
        run: |
          rm -rf windows

      - name: Create Windows platform
        run: |
          flutter create --platforms=windows --project-name pass_managers .

      - name: Check Visual Studio references
        run: |
          grep -R "Visual Studio 16 2019" windows || true

      - name: Commit changes
        run: |
          git config user.name "AI-Agent"
          git config user.email "actions@github.com"

          git add windows

          git commit -m "Regenerate clean Windows platform" || echo "No changes"

          git push
