"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Add Record to ask for row and column counts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/screens/table_page.dart')
          text = path.read_text(encoding='utf-8')

          old_method = '''  Future<int?> _askPositiveInteger() async {
    final controller = TextEditingController();
    final value = await showDialog<int>(
      context: context,
      builder: (dialogContext) => AlertDialog(
        title: const Text('Add Record'),
        content: TextField(
          controller: controller,
          autofocus: true,
          keyboardType: TextInputType.number,
          decoration: const InputDecoration(
            labelText: 'Number of columns',
            hintText: 'Example: 5',
            border: OutlineInputBorder(),
          ),
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(dialogContext),
            child: const Text('Cancel'),
          ),
          ElevatedButton(
            onPressed: () {
              final count = int.tryParse(controller.text.trim());
              if (count != null && count > 0) {
                Navigator.pop(dialogContext, count);
              }
            },
            child: const Text('Continue'),
          ),
        ],
      ),
    );
    controller.dispose();
    return value;
  }
'''

          new_method = '''  Future<Map<String, int>?> _askRowAndColumnCounts() async {
    final rowsController = TextEditingController(text: '1');
    final columnsController = TextEditingController();

    final result = await showDialog<Map<String, int>>(
      context: context,
      builder: (dialogContext) => AlertDialog(
        title: const Text('Add Record'),
        content: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            TextField(
              controller: rowsController,
              autofocus: true,
              keyboardType: TextInputType.number,
              decoration: const InputDecoration(
                labelText: 'Number of rows',
                hintText: 'Example: 3',
                border: OutlineInputBorder(),
              ),
            ),
            const SizedBox(height: 12),
            TextField(
              controller: columnsController,
              keyboardType: TextInputType.number,
              decoration: const InputDecoration(
                labelText: 'Number of columns',
                hintText: 'Example: 5',
                border: OutlineInputBorder(),
              ),
            ),
          ],
        ),
        actions: [
          TextButton(
            onPressed: () => Navigator.pop(dialogContext),
            child: const Text('Cancel'),
          ),
          ElevatedButton(
            onPressed: () {
              final rowCount = int.tryParse(rowsController.text.trim());
              final columnCount = int.tryParse(columnsController.text.trim());
              if (rowCount != null &&
                  rowCount > 0 &&
                  columnCount != null &&
                  columnCount > 0) {
                Navigator.pop(dialogContext, {
                  'rows': rowCount,
                  'columns': columnCount,
                });
              }
            },
            child: const Text('Continue'),
          ),
        ],
      ),
    );

    rowsController.dispose();
    columnsController.dispose();
    return result;
  }
'''

          if old_method not in text:
              raise SystemExit('Expected _askPositiveInteger method was not found.')

          text = text.replace(old_method, new_method, 1)

          old_add = '''  Future<void> addRow() async {
    final count = await _askPositiveInteger();
    if (count == null) return;

    final names = await _askColumnNames(count);
    if (names == null || names.isEmpty) return;

    try {
      final rowId = await _repository.createRow(tableId: widget.tableId);
      final columns = names.map(TableColumnDefinition.new).toList();
      final row = TableRowData(columns: columns);

      for (var i = 0; i < names.length; i++) {
        await _repository.createField(
          rowId: rowId,
          name: names[i],
          position: i,
          value: '',
        );
      }

      if (!mounted) return;
      setState(() {
        widget.table.rows.add(row);
        _rowIds[row] = rowId;
      });
    } catch (error) {
      _showError('Failed to add record: $error');
    }
  }
'''

          new_add = '''  Future<void> addRow() async {
    final counts = await _askRowAndColumnCounts();
    if (counts == null) return;

    final rowCount = counts['rows']!;
    final columnCount = counts['columns']!;
    final names = await _askColumnNames(columnCount);
    if (names == null || names.isEmpty) return;

    try {
      final createdRows = <TableRowData>[];
      final createdIds = <TableRowData, int>{};

      for (var rowIndex = 0; rowIndex < rowCount; rowIndex++) {
        final rowId = await _repository.createRow(tableId: widget.tableId);
        final columns = names.map(TableColumnDefinition.new).toList();
        final row = TableRowData(columns: columns);

        for (var i = 0; i < names.length; i++) {
          await _repository.createField(
            rowId: rowId,
            name: names[i],
            position: i,
            value: '',
          );
        }

        createdRows.add(row);
        createdIds[row] = rowId;
      }

      if (!mounted) return;
      setState(() {
        widget.table.rows.addAll(createdRows);
        _rowIds.addAll(createdIds);
      });
    } catch (error) {
      _showError('Failed to add records: $error');
    }
  }
'''

          if old_add not in text:
              raise SystemExit('Expected addRow method was not found.')

          text = text.replace(old_add, new_add, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/patch_add_row_count.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/table_page.dart .github/workflows/patch_add_row_count.yml
          git commit -m "Ask for row count when adding records"
          git push origin main
