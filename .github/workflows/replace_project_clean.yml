name: Replace Pass-Managers From Uploaded ZIP

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    name: Replace project from ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          zips=(Pass-Managers-*.zip)

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one Pass-Managers-*.zip in repository root."
            printf 'Found: %s\n' "${zips[@]:-<none>}"
            exit 1
          fi

          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "Using ${zips[0]}"

      - name: Extract and validate ZIP
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail

          rm -rf "$RUNNER_TEMP/pass_managers"
          mkdir -p "$RUNNER_TEMP/pass_managers"

          unzip -q -o "$ZIP_FILE" -d "$RUNNER_TEMP/pass_managers"

          if [ -f "$RUNNER_TEMP/pass_managers/pubspec.yaml" ]; then
            ROOT="$RUNNER_TEMP/pass_managers"
          else
            ROOT="$(find "$RUNNER_TEMP/pass_managers" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi

          test -n "${ROOT:-}"
          test -f "$ROOT/pubspec.yaml"

          required=(
            "pubspec.yaml"
            "pubspec.lock"
            "lib/main.dart"
            "lib/services/backup_service.dart"
            "lib/services/pdf_export_service.dart"
            "android/settings.gradle"
            "android/app/build.gradle"
            "android/gradle/wrapper/gradle-wrapper.properties"
            "windows/CMakeLists.txt"
            "windows/flutter/CMakeLists.txt"
            "windows/flutter/generated_plugins.cmake"
            "windows/runner/CMakeLists.txt"
            "windows/runner/main.cpp"
            ".github/workflows/build.yml"
          )

          for f in "${required[@]}"; do
            test -f "$ROOT/$f" || {
              echo "Missing required file in ZIP: $f"
              exit 1
            }
          done

          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Verify critical fixes in ZIP
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'compileSdk = 36' "$PROJECT_ROOT/android/app/build.gradle"
          grep -q 'function(APPLY_STANDARD_SETTINGS TARGET)' "$PROJECT_ROOT/windows/CMakeLists.txt"
          grep -q 'version: 1.0.1+2' "$PROJECT_ROOT/pubspec.yaml"
          grep -q 'List<int>.from(await key.extractBytes())' "$PROJECT_ROOT/lib/services/backup_service.dart"

          echo "Critical project fixes verified."

      - name: Remove old project files
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail

          # Keep .git and the currently running workflow intact. Replacing the
          # workflow itself requires a token with GitHub Actions workflow-write
          # permission; the project replacement itself does not.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            -exec rm -rf {} +

          find .github/workflows -type f \
            ! -name 'replace-project.yml' \
            -delete 2>/dev/null || true

      - name: Install project files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a "$PROJECT_ROOT/" ./

      - name: Remove uploaded ZIP from repository tree
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail
          rm -f "$ZIP_FILE"

      - name: Remove known legacy files
        shell: bash
        run: |
          set -euo pipefail

          forbidden=(
            "AI_REPORT.json"
            "ai-report.txt"
            "test/widget_test.dart"
            "lib/services/password_service.dart"
            ".github/workflows/flutter-create.yml"
            ".github/workflows/regenerate-windows.yml"
          )

          for f in "${forbidden[@]}"; do
            if [ -e "$f" ]; then
              echo "Legacy file still exists: $f"
              exit 1
            fi
          done

      - name: Show replacement result
        shell: bash
        run: |
          set -euo pipefail
          echo '===== STATUS ====='
          git status --short
          echo
          echo '===== CRITICAL FILES ====='
          ls -lh \
            pubspec.yaml \
            android/app/build.gradle \
            windows/CMakeLists.txt \
            lib/services/backup_service.dart \
            lib/services/pdf_export_service.dart

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes detected.'
            exit 0
          fi

          git commit -m 'Replace Pass-Managers with clean project'

      - name: Push replacement
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:main
