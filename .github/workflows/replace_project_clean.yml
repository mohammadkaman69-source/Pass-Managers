name: Replace Pass-Managers From Uploaded ZIP

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace-project:
    name: Replace project from ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find uploaded ZIP
        id: zip
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(Pass-Managers-*.zip)

          if [ "${#zips[@]}" -ne 1 ]; then
            echo "Expected exactly one Pass-Managers-*.zip in repository root."
            printf 'Found: %s\n' "${zips[@]:-<none>}"
            exit 1
          fi

          echo "zip=${zips[0]}" >> "$GITHUB_OUTPUT"
          echo "Using ${zips[0]}"

      - name: Extract and validate ZIP
        id: project
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.zip }}
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/pass_managers"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          unzip -q -o "$ZIP_FILE" -d "$ROOT"

          if [ -f "$ROOT/pubspec.yaml" ]; then
            PROJECT_ROOT="$ROOT"
          else
            PROJECT_ROOT="$(find "$ROOT" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          fi

          test -n "${PROJECT_ROOT:-}"
          test -f "$PROJECT_ROOT/pubspec.yaml"
          test -f "$PROJECT_ROOT/lib/main.dart"
          test -d "$PROJECT_ROOT/lib"
          test -d "$PROJECT_ROOT/android"
          test -d "$PROJECT_ROOT/windows"
          test -f "$PROJECT_ROOT/.github/workflows/build.yml"

          grep -q 'compileSdk = 36' "$PROJECT_ROOT/android/app/build.gradle"
          grep -q 'applicationId = "com.example.pass_managers"' "$PROJECT_ROOT/android/app/build.gradle"
          grep -q 'local_auth: \^3.0.2' "$PROJECT_ROOT/pubspec.yaml"
          grep -q 'function(APPLY_STANDARD_SETTINGS TARGET)' "$PROJECT_ROOT/windows/CMakeLists.txt"
          grep -q '_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS' "$PROJECT_ROOT/windows/CMakeLists.txt"
          grep -q 'cxx_std_20' "$PROJECT_ROOT/windows/CMakeLists.txt"

          echo "PROJECT_ROOT=$PROJECT_ROOT" >> "$GITHUB_ENV"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Remove old project tree
        shell: bash
        run: |
          set -euo pipefail

          # Preserve Git metadata and this workflow while the replacement runs.
          # All normal project files are removed, including stale generated files.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$ZIP_FILE" \
            -exec rm -rf {} +

          find .github/workflows -mindepth 1 -maxdepth 1 -type f \
            ! -name 'replace_project_clean.yml' \
            -delete 2>/dev/null || true

      - name: Install project from ZIP
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete "$PROJECT_ROOT/" ./
          rm -f "$ZIP_FILE"

      - name: Remove generated build state
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build .dart_tool
          rm -rf windows/flutter/ephemeral
          rm -f android/local.properties

      - name: Verify final tree
        shell: bash
        run: |
          set -euo pipefail

          test -f pubspec.yaml
          test -f lib/main.dart
          test -f android/settings.gradle
          test -f android/app/build.gradle
          test -f windows/CMakeLists.txt
          test -f windows/flutter/CMakeLists.txt
          test -f windows/runner/CMakeLists.txt
          test -f .github/workflows/build.yml

          test ! -d windows/flutter/ephemeral
          test ! -d build
          test ! -d .dart_tool
          test ! -f android/local.properties

          echo '===== FINAL PROJECT STATUS ====='
          git status --short

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes detected.'
            exit 0
          fi

          git commit -m 'Replace Pass-Managers project from ZIP'

      - name: Push replacement
        shell: bash
        env:
          AI_GITHUB_TOKEN: ${{ secrets.AI_GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "${AI_GITHUB_TOKEN:-}" ]; then
            git remote set-url origin "https://x-access-token:${AI_GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            git push origin HEAD:main
          else
            echo 'Using GITHUB_TOKEN.'
            echo 'If build.yml itself was changed, the token must have GitHub workflow-file write permission.'
            git push origin HEAD:main
          fi
