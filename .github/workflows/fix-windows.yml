name: Fix Windows Platform

"on":
  workflow_dispatch:

jobs:
  fix-windows:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Regenerate Windows
        run: |
          flutter create --platforms=windows --project-name pass_managers .

      - name: Commit changes
        run: |
          git config user.name "AI-Agent"
          git config user.email "actions@github.com"

          git add windows

          git commit -m "Regenerate Windows platform files" || echo "No changes"

          git push
