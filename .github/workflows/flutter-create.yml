name: Create Flutter Platforms

"on":
  workflow_dispatch:

jobs:
  create-flutter:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Check Flutter
        run: |
          flutter --version

      - name: Create Android and Windows platforms
        run: |
          flutter create --platforms=android,windows .

      - name: Commit generated files
        run: |
          git config user.name "AI-Agent"
          git config user.email "actions@github.com"

          git add .

          git commit -m "Generate Flutter Android and Windows platforms" || echo "No changes"

          git push
